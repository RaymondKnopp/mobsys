   <g id="text_2">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6aab5c" x="502.56" y="53.718281" transform="rotate(-0 502.56 53.718281)">UE</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(77.954062 286.203516)">MAC scheduler + AMC</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(68.119453 296.623477)">MCS, rank, precoder (PMI),</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(97.136719 307.043437)">RB allocation;</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(79.940391 317.463398)">outer loop: CQI offset</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(93.192187 327.883359)">from ACK/NACK</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(112.052813 138.223477)">PHY TX</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(85.043672 148.643438)">LDPC, QAM, layers,</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(66.469922 159.063398)">precoding; + DMRS, CSI-RS</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(327.652734 138.223477)">DL radio channel</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(334.056094 148.643438)">H(t, f) + noise</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(333.108281 159.063398)">+ interference</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(577.499766 133.013496)">UE receiver</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(524.168437 143.433457)">channel estimation (DMRS, CSI-RS)</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(545.724141 153.853418)">→ MIMO detection → LLRs</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(548.414297 164.273379)">→ LDPC decoding → CRC</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(566.142187 309.033457)">CSI computation</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(545.474531 319.453418)">CQI, RI, PMI (from CSI-RS)</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(325.151016 309.033457)">UL feedback (UCI)</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(320.195391 319.453418)">on PUCCH or PUSCH</text>
   </g>
   <g id="text_9">
