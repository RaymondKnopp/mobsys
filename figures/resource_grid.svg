    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #8a8a8a" transform="translate(452.88 334.042453)">subcarriers); it is shaded here over</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #8a8a8a" transform="translate(452.88 344.120484)">one slot to show the grid.</text>
