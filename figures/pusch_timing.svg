   <g id="text_17">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #8a8a8a" transform="translate(70.56 354.987328)">K2: from the time-domain row chosen by the DCI (pusch-TimeDomainAllocationList, with SLIV).</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #8a8a8a" transform="translate(70.56 364.505469)">K2 = 0 (same slot) is allowed only if the PUSCH starts at least N2 symbols (UE processing time, TS 38.214 §6.4) after the PDCCH: in practice FDD.</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #8a8a8a" transform="translate(70.56 374.023609)">Msg3 (RAR grant) uses K2 + Δ (TS 38.214 Table 6.1.2.1.1-5).</text>
   </g>
